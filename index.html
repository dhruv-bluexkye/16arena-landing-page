    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF5722; 
        }
        
        /* Hide scrollbar for clean horizontal scroll areas */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Utilities */
        .glass-panel {
            background: rgba(25, 25, 25, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .pedestal-gradient {
            background: radial-gradient(circle at center, #2a2a2a 0%, #121212 100%);
            box-shadow: inset 0 -5px 15px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.5);
        }

        /* === 16Arena design system === */

        /* Angular facet — echoes the logo's diagonal cuts. Top-right + bottom-left clipped. */
        .clip-facet {
            clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
        }
        .clip-facet-sm {
            clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
        }
        /* Slanted edge for accent strips */
        .clip-slant {
            clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
        }

        /* Gradient text matching the brand orange */
        .text-gradient {
            background: linear-gradient(135deg, #FF973C 0%, #FF6A00 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Ambient dual-tone glow: warm orange + cool steel counter-light */
        .glow-warm { background: radial-gradient(circle, rgba(255,106,0,0.18) 0%, transparent 70%); }
        .glow-cool { background: radial-gradient(circle, rgba(72,98,150,0.16) 0%, transparent 70%); }

        /* Technical grid atmosphere */
        .grid-bg {
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 75%);
        }

        /* Animated gradient border for feature cards */
        .border-glow {
            position: relative;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .border-glow::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,106,0,0.6), transparent 40%, transparent 60%, rgba(255,151,60,0.4));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .border-glow:hover::before { opacity: 1; }

        /* Eyebrow label with accent tick */
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            font-family: 'Saira Condensed', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: #FF973C;
        }
        .eyebrow::before {
            content: "";
            width: 28px;
            height: 2px;
            background: linear-gradient(90deg, #FF6A00, transparent);
        }

        /* Image-backed card overlay: darkens top for legible text */
        .card-img-overlay {
            background: linear-gradient(180deg, rgba(10,10,12,0.92) 0%, rgba(10,10,12,0.55) 45%, rgba(10,10,12,0.85) 100%);
        }
        /* Headline kerning for the big condensed display type */
        .display-tight { letter-spacing: -0.01em; }

        /* Marquee for the trust/stats strip */
        @keyframes marquee {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }
        .marquee-track {
            display: flex;
            width: max-content;
            animation: marquee 28s linear infinite;
        }
        @media (prefers-reduced-motion: reduce) {
            .marquee-track { animation: none; }
            .animate-float, .animate-float-delayed, .animate-float-slow { animation: none !important; }
        }

        body {
            background-color: #0A0A0C;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        
        /* Ensure full viewport height on mobile */
        html, body {
            height: 100%;
            height: 100dvh; /* Dynamic viewport height for mobile */
        }
        
        #root {
            min-height: 100vh;
            min-height: 100dvh;
        }
        
        /* Enhanced Smooth Scrolling */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }
        
        @media (prefers-reduced-motion: no-preference) {
            html {
                scroll-behavior: smooth;
            }
        }
        
        /* Scroll Progress Bar */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, #FF5722, #ff8a50, #FF5722);
            z-index: 9999;
            transition: width 0.1s ease-out;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.5);
        }
        
        /* Fade-in Animation */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .fade-in-left {
            opacity: 0;
            transform: translateX(-30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .fade-in-left.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        .fade-in-right {
            opacity: 0;
            transform: translateX(30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .fade-in-right.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        /* Stagger Animation Delays */
        .stagger-1 { transition-delay: 0.1s; }
        .stagger-2 { transition-delay: 0.2s; }
        .stagger-3 { transition-delay: 0.3s; }
        .stagger-4 { transition-delay: 0.4s; }
        .stagger-5 { transition-delay: 0.5s; }
        
        /* Parallax Container */
        .parallax-container {
            will-change: transform;
        }
    </style>
