<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>16Arena</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FF5722",
                        "primary-hover": "#e64a19",
                        "background-dark": "#050505",
                        "surface-dark": "#121212",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        display: ["'Chakra Petch'", "sans-serif"], 
                        sans: ["'Inter'", "sans-serif"],
                    },
                    boxShadow: {
                        'neon': '0 0 20px rgba(255, 87, 34, 0.4)',
                        'pedestal': '0 20px 50px -12px rgba(0, 0, 0, 0.9)',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 5s ease-in-out infinite 0.5s',
                        'float-slow': 'float 7s ease-in-out infinite 1s',
                        'pulse-slow': 'pulse 3s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                },
            },
        };
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505; 
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FF5722; 
        }
        
        /* Hide scrollbar for clean horizontal scroll areas */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Utilities */
        .glass-panel {
            background: rgba(25, 25, 25, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .pedestal-gradient {
            background: radial-gradient(circle at center, #2a2a2a 0%, #121212 100%);
            box-shadow: inset 0 -5px 15px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.5);
        }
        
        body {
            background-color: #050505;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        
        /* Ensure full viewport height on mobile */
        html, body {
            height: 100%;
            height: 100dvh; /* Dynamic viewport height for mobile */
        }
        
        #root {
            min-height: 100vh;
            min-height: 100dvh;
        }
        
        /* Enhanced Smooth Scrolling */
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 80px;
        }
        
        @media (prefers-reduced-motion: no-preference) {
            html {
                scroll-behavior: smooth;
            }
        }
        
        /* Scroll Progress Bar */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0%;
            height: 3px;
            background: linear-gradient(90deg, #FF5722, #ff8a50, #FF5722);
            z-index: 9999;
            transition: width 0.1s ease-out;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.5);
        }
        
        /* Fade-in Animation */
        .fade-in-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .fade-in-left {
            opacity: 0;
            transform: translateX(-30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .fade-in-left.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        .fade-in-right {
            opacity: 0;
            transform: translateX(30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
        }
        
        .fade-in-right.visible {
            opacity: 1;
            transform: translateX(0);
        }
        
        /* Stagger Animation Delays */
        .stagger-1 { transition-delay: 0.1s; }
        .stagger-2 { transition-delay: 0.2s; }
        .stagger-3 { transition-delay: 0.3s; }
        .stagger-4 { transition-delay: 0.4s; }
        .stagger-5 { transition-delay: 0.5s; }
        
        /* Parallax Container */
        .parallax-container {
            will-change: transform;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>

</head>

</html>
